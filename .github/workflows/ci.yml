# Integración continua para pull requests y ramas principales · Otoch v1.0.0
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint y tipos
        run: pnpm lint && pnpm typecheck
      - name: Pruebas unitarias con cobertura
        run: pnpm test -- --coverage
      - name: Compilación
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
        run: pnpm --filter web build
      - name: Auditoría de dependencias (falla con vulnerabilidades altas o críticas)
        run: pnpm audit --audit-level=high

  e2e:
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
      - run: pnpm install --frozen-lockfile
      - name: Base de datos local con migraciones y RLS
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime && supabase db reset
      - name: Verificar que todas las tablas tengan RLS (lección LA-01)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc \
            "select count(*) from pg_tables where schemaname='public' and not rowsecurity" | grep -qx 0
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas extremo a extremo (Playwright)
        run: pnpm test:e2e
